name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Upload Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t vuln-bank:${{ github.sha }} .

      - name: Save Docker image
        run: docker save vuln-bank:${{ github.sha }} -o image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  secret_scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install and Run Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz -O gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --report-path gitleaks-report.json --report-format json -v
        continue-on-error: true
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sast_scan:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      vulnerabilities_found: ${{ steps.bandit_check.outputs.findings }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Bandit Scan and Check for Findings
        id: bandit_check
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || exit_code=$?
          if [[ -n "$exit_code" && "$exit_code" -ne 0 ]]; then
            echo "Temuan SAST terdeteksi."
            echo "findings=true" >> $GITHUB_OUTPUT
          else
            echo "Tidak ada temuan SAST."
            echo "findings=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  container_scan:
    name: Container Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      vulnerabilities_found: ${{ steps.trivy_check.outputs.findings }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load -i image.tar
      - name: Install, Run Trivy, and Check for Findings
        id: trivy_check
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
          trivy image --format json --output trivy-report.json --severity CRITICAL,HIGH --exit-code 1 vuln-bank:${{ github.sha }} || exit_code=$?
          if [[ -n "$exit_code" && "$exit_code" -ne 0 ]]; then
            echo "Temuan kontainer terdeteksi."
            echo "findings=true" >> $GITHUB_OUTPUT
          else
            echo "Tidak ada temuan kontainer."
            echo "findings=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  misconfig_scan:
    name: Misconfiguration Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install and Run Trivy Misconfig Scan
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
          trivy config --format json --output misconfig-report.json .
        continue-on-error: true
      - name: Upload Misconfig report
        uses: actions/upload-artifact@v4
        with:
          name: misconfig-report
          path: misconfig-report.json

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Application and ZAP Scan
        run: |
          sudo apt-get update && sudo apt-get install -y docker-compose
          docker-compose up -d
          sudo chmod -R 777 ${{ github.workspace }}
          docker run --network host -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:5000 -J zap-report.json -l PASS
        continue-on-error: true
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.json

  ai_security_analysis:
    name: AI Security Analysis 🤖
    runs-on: ubuntu-latest
    if: always()
    needs: [secret_scan, sast_scan, container_scan, misconfig_scan, dast]
    outputs:
      summary: ${{ steps.analyze.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all scan reports
        uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install google-generativeai
      - name: Run AI Analysis
        id: analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          GITLEAKS_REPORT=$(find reports/gitleaks-report -name gitleaks-report.json)
          BANDIT_REPORT=$(find reports/bandit-report -name bandit-report.json)
          TRIVY_REPORT=$(find reports/trivy-report -name trivy-report.json)
          MISCONFIG_REPORT=$(find reports/misconfig-report -name misconfig-report.json)
          ZAP_REPORT=$(find reports/zap-report -name zap-report.json)
          AI_SUMMARY=$(python3 scripts/analyze.py \
            --gitleaks "$GITLEAKS_REPORT" \
            --bandit "$BANDIT_REPORT" \
            --trivy "$TRIVY_REPORT" \
            --misconfig "$MISCONFIG_REPORT" \
            --dast "$ZAP_REPORT")
          echo 'summary<<EOF' >> $GITHUB_OUTPUT
          echo "$AI_SUMMARY" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  notify:
    name: Send Scan Summary Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [sast_scan, container_scan, ai_security_analysis]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Send Discord Webhook Notification
        env:
          SAST_FINDINGS: "${{ needs.sast_scan.outputs.vulnerabilities_found }}"
          CONTAINER_FINDINGS: "${{ needs.container_scan.outputs.vulnerabilities_found }}"
          AI_SUMMARY: "${{ needs.ai_security_analysis.outputs.summary }}"
          REPO_NAME: "${{ github.repository }}"
          ACTOR: "${{ github.actor }}"
          COMMIT_SHA: "${{ github.sha }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ "$SAST_FINDINGS" == "true" || "$CONTAINER_FINDINGS" == "true" ]]; then
            export PIPELINE_STATUS="Gagal ❌ (Ada Temuan Kritis)"
            export PIPELINE_COLOR=15158332 # Merah
          else
            export PIPELINE_STATUS="Lolos ✅"
            export PIPELINE_COLOR=3066993 # Hijau
          fi
          # Pastikan skrip `generate_payload.sh` Anda diupdate untuk menggunakan variabel env yang baru
          JSON_PAYLOAD=$(bash scripts/generate_payload.sh)
          curl -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"

  create-issue-on-failure:
    name: Create Issue on Findings
    runs-on: ubuntu-latest
    if: needs.sast_scan.outputs.vulnerabilities_found == 'true' || needs.container_scan.outputs.vulnerabilities_found == 'true'
    needs: [sast_scan, container_scan, ai_security_analysis]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const aiAnalysis = `${{ needs.ai_security_analysis.outputs.summary }}`;
            let body = `## ⚠️ Temuan Keamanan Terdeteksi\n\n`;
            body += `Pipeline menemukan kerentanan keamanan yang memerlukan perhatian.\n\n`;
            body += `### Ringkasan dan Analisis dari AI 🤖\n\n`;
            body += aiAnalysis;
            body += `\n\n[Lihat detail run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            await github.rest.issues.create({
              owner: owner,
              repo: repo,
              title: `AI-Assisted Security Findings in commit ${{ github.sha }}`,
              body: body,
              labels: ['security', 'bug', 'ai-analyzed']
            });