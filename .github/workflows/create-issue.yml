# .github/workflows/create-issue.yml
name: Create Issue on Failure

on:
  workflow_run:
    # FIX 1: Gunakan 'name' dari workflow CI, bukan nama file.
    workflows: ["DevSecOps Security Pipeline"]
    types:
      - completed

jobs:
  create_issue:
    name: Create GitHub Issue
    runs-on: ubuntu-latest
    # FIX 2: Hanya berjalan jika workflow sebelumnya gagal.
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    # FIX 3: Tambahkan izin untuk membuat issue. Ini WAJIB.
    permissions:
      issues: write

    steps:
      # FIX 4: Disederhanakan menjadi satu langkah. Tidak perlu checkout atau file sementara.
      - name: Create GitHub Issue
        env:
          # Token GITHUB_TOKEN sudah otomatis tersedia jika permissions diatur.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ambil URL dari run yang gagal untuk referensi
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh issue create \
            --title "DevSecOps Pipeline Failure for commit ${{ github.event.workflow_run.head_sha }}" \
            --body "### :warning: DevSecOps Pipeline Failure
            A security scan has failed in the main CI pipeline.

            - **Commit:** \`${{ github.event.workflow_run.head_sha }}\`
            - **Triggered by:** @${{ github.event.workflow_run.actor.login }}
            
            Please review the failed pipeline run for details:
            ${{ env.RUN_URL }}" \
            --label "security,bug"